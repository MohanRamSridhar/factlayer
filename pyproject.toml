[project]
name = "factlayer"
version = "0.1.0"
description = "A fact knowledge layer: extracts grounded facts from PDFs and reconciles them across documents."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
factlayer = "factlayer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factlayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
